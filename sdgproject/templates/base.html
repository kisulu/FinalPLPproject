<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tutoring Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <!-- Branding -->
    <a class="navbar-brand" href="{% url 'homepage' %}">Tutoring Platform</a>

    <!-- Collapse Button for Mobile -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navbar Content -->
    <div class="collapse navbar-collapse" id="navbarContent">
      <!-- Left side links -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="{% url 'assignment_list' %}">Assignments</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'session_list' %}">Sessions</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'teacher_list' %}">Teachers</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'payment_list' %}">Payments</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'message_list' %}">Messages</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'review_list' %}">Reviews</a></li>
      </ul>

      <!-- Right side (auth controls) -->
      <div class="d-flex">
        {% if user.is_authenticated %}
          <span class="navbar-text text-light me-2">
            Hello, {{ user.username }}
          </span>
          <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
        {% else %}
          <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">Login</a>
          <a href="{% url 'register' %}" class="btn btn-warning btn-sm">Register</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>

<!-- Page Content -->
<div class="container mt-4">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
