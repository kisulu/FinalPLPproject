<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tutor</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        padding-top: 0px; /* adjust depending on navbar height */
      }
      /* Center the main nav links */
      .navbar .navbar-collapse {
        justify-content: center;
      }

      .navbar-nav {
        gap: 1rem;
        align-items: center;
      }

      /* Balance left & right spacing symmetrically */
      .navbar-brand {
        margin-left: 90px; /* Moves brand toward center slightly */
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      .nav-auth {
        margin-right: 90px; /* Moves Login/Register toward center slightly */
      }

      /* Make spacing feel balanced visually */
      .navbar {
        padding-left: 1rem;
        padding-right: 1rem;
      }

      .nav-link {
        font-size: 0.95rem;
        transition: color 0.2s ease-in-out;
      }

      .nav-link:hover {
        color: #ffc107 !important;
      }

      .btn {
        transition: all 0.2s ease-in-out;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      /* Adjustments for smaller screens */
      @media (max-width: 991.98px) {
        .navbar .navbar-collapse {
          justify-content: flex-start;
        }
        .navbar-brand {
          margin-left: 0;
        }
        .nav-auth {
          margin-right: 0;
          margin-top: 0.5rem;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm fixed-top">
      <div class="container-fluid">
        <!-- Branding (left) -->
        <a class="navbar-brand" href="{% url 'homepage' %}">Tutor</a>

        <!-- Collapse Button -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
          aria-controls="navbarContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Centered links -->
        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="{% url 'assignment_list' %}"
                >Assignments</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'session_list' %}">Sessions</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'teacher_list' %}">Teachers</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'payment_list' %}">Payments</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'message_list' %}">Messages</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'review_list' %}">Reviews</a>
            </li>
          </ul>
        </div>

        <!-- Auth controls (right) -->
        <div class="d-flex nav-auth align-items-center">
          {% if user.is_authenticated %}
          <span class="navbar-text text-light me-2"
            >Hello, {{ user.username }}</span
          >
          <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm"
            >Logout</a
          >
          {% else %}
          <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2"
            >Login</a
          >
          <a href="{% url 'register' %}" class="btn btn-warning btn-sm"
            >Register</a
          >
          {% endif %}
        </div>
      </div>
    </nav>

    <!-- Page Content -->
    <div>{% block content %}{% endblock %}</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
