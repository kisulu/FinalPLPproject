<!DOCTYPE html>
<html>
<head>
    <title>Online Tutoring Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="text-center mb-4">Welcome to the Tutoring Platform</h1>

    <div class="row">
        <div class="col-md-4">
            <div class="card shadow-sm mb-4">
                <div class="card-body text-center">
                    <h5 class="card-title">Assignments</h5>
                    <p class="card-text">Post or manage homework help requests.</p>
                    <a href="{% url 'assignment_list' %}" class="btn btn-primary">View Assignments</a>
                </div>
            </div>
        </div>
        
        <div class="col-md-4">
            <div class="card shadow-sm mb-4">
                <div class="card-body text-center">
                    <h5 class="card-title">Tutoring Sessions</h5>
                    <p class="card-text">Schedule or manage tutoring sessions.</p>
                    <a href="{% url 'session_list' %}" class="btn btn-success">View Sessions</a>
                </div>
            </div>
        </div>
        
        <div class="col-md-4">
            <div class="card shadow-sm mb-4">
                <div class="card-body text-center">
                    <h5 class="card-title">Teachers</h5>
                    <p class="card-text">Browse teachers by subject and expertise.</p>
                    <a href="{% url 'teacher_list' %}" class="btn btn-info">View Teachers</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
